[package]
name = "terse-substrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Rust gRPC client bindings for Agent Substrate, maintained by Terse"
license = "Apache-2.0"
repository = "https://github.com/TerseAI/terse-substrate"
readme = "README.md"
keywords = ["gke", "grpc", "sandbox", "protobuf"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**", "proto/**", "tests/**", "build.rs", "upstream.json", "README.md", "LICENSE", "NOTICE"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14"

[dev-dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
